[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kryptonfs-dash"
version = "0.1.0"
description = "Terminal dashboard for KryptonFS telemetry"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kryptonfs-dash = "kryptonfs_dash.__main__:main"

[tool.setuptools]
packages = ["kryptonfs_dash", "kryptonfs_dash.widgets"]

[tool.setuptools.package-data]
kryptonfs_dash = ["theme.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
